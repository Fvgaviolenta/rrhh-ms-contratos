server:
  port: ${SERVER_PORT:8083}
spring:
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: rrhh-contratos
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3309/rrhh_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:rrhh}
    password: ${SPRING_DATASOURCE_PASSWORD:rrhh_local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    table: flyway_history_contratos
    baseline-on-migrate: true
    baseline-version: 0
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_xxxxxxxxx}
          audiences: ${COGNITO_AUDIENCE:}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
rrhh:
  sqs:
    enabled: ${RRHH_SQS_ENABLED:false}
    events-queue-url: ${SQS_EVENTS_QUEUE_URL:}
    region: ${AWS_REGION:us-east-1}
    publish-delay-ms: ${SQS_PUBLISH_DELAY_MS:5000}
  integrations:
    trabajadores:
      base-url: ${RRHH_TRABAJADORES_URL:http://localhost:8082}
    asistencia:
      base-url: ${RRHH_ASISTENCIA_URL:http://localhost:8084}
  security:
    jwt:
      role-claim: ${JWT_ROLE_CLAIM:custom:role}
      tenant-claim: ${JWT_TENANT_CLAIM:custom:tenant_id}
      user-id-claim: ${JWT_USER_ID_CLAIM:custom:user_id}
      trabajador-id-claim: ${JWT_TRABAJADOR_ID_CLAIM:custom:trabajador_id}
