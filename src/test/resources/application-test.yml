spring:
  datasource:
    url: jdbc:tc:mysql:8.0:///contratos
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    table: flyway_history_contratos
    # db/test-callbacks crea las tablas de identity que lee el servicio (solo en tests).
    locations: classpath:db/migration,classpath:db/test-callbacks
